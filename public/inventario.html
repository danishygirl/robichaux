<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#c6c0b5" />
  <title>COVEN — Inventário</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./home.css" />
  <link rel="stylesheet" href="./inventario.css" />
</head>
<body data-page="inventario">
  <div class="page-noise" aria-hidden="true"></div>
  <div class="mystic-overlay" aria-hidden="true"></div>

  <header class="site-header">
    <a class="brand" href="./index.html" aria-label="COVEN — Home">
      <span class="brand-mark">C</span>
      <span class="brand-text">COVEN</span>
    </a>
    <nav class="main-nav" id="mainNav" aria-label="Menu principal"></nav>
    <button class="power-button" id="powerButton" type="button" aria-label="Alternar efeitos visuais" title="Alternar efeitos visuais">
      <span class="power-icon" aria-hidden="true"></span>
    </button>
  </header>

  <main class="inventory-stage">
    <section class="inventory-shell" aria-labelledby="inventoryTitle">
      <header class="inventory-heading">
        <div>
          <p class="eyebrow" id="inventoryEyebrow"></p>
          <h1 id="inventoryTitle"></h1>
        </div>
        <section class="player-panel" id="playerPanel" aria-label="Resumo do jogador">
          <div class="player-meta">
            <h2 id="playerName"></h2>
            <div class="player-stats-list" id="playerStatsList"></div>
          </div>
          <div class="player-level-badge">
            <span class="player-level-label">LEVEL</span>
            <strong id="playerLevel"></strong>
            <span class="player-level-xp" id="playerXpProgress"></span>
          </div>
        </section>
      </header>

      <div class="inventory-columns">
        <aside class="inventory-preview-panel">
          <div class="preview-header-row">
            <div>
              <p class="preview-eyebrow">ACTIVE ITEM</p>
              <span class="preview-status" id="selectedStatus"></span>
            </div>
            <span class="preview-counter" id="selectedCounter"></span>
          </div>

          <button class="selected-card" id="selectedCard" type="button" aria-label="Abrir detalhes do item selecionado">
            <span class="selected-flag" id="selectedRarity"></span>
            <div class="selected-image-wrap">
              <img class="selected-image" id="selectedImage" alt="" />
            </div>
            <div class="selected-copy">
              <span class="selected-category" id="selectedCategory"></span>
              <h2 id="selectedName"></h2>
              <p id="selectedSummary"></p>
            </div>
            <div class="selected-actions-row">
              <span class="selected-xp-cost" id="selectedXpCost"></span>
              <span class="selected-open">ABRIR FICHA ↗</span>
            </div>
          </button>

          <div class="preview-mini-stats" id="selectedMiniStats"></div>
        </aside>

        <section class="inventory-catalog">
          <div class="catalog-topbar">
            <div class="catalog-filters" id="catalogFilters" role="group" aria-label="Categorias do inventário"></div>
            <div class="catalog-meta">
              <span id="catalogActiveLabel"></span>
              <span id="catalogCount"></span>
            </div>
          </div>

          <div class="inventory-grid" id="inventoryGrid" aria-live="polite"></div>
          <p class="catalog-empty" id="catalogEmpty" hidden>NENHUM ITEM REGISTRADO NESTA CATEGORIA.</p>
        </section>
      </div>
    </section>
  </main>

  <dialog class="item-dialog" id="itemDialog" aria-labelledby="itemModalName">
    <article class="item-sheet">
      <button class="sheet-close" id="itemClose" type="button" aria-label="Fechar ficha do item">×</button>

      <header class="sheet-topbar">
        <div class="sheet-stamp">
          <span class="stamp-ring"></span>
          <strong>C</strong>
        </div>
        <div class="sheet-copy">
          <span>ROBICHAUX SUPPLY ARCHIVE</span>
          <span>INVENTORY EXCHANGE RECORD</span>
          <span>NEW ORLEANS // COVEN MARKET</span>
        </div>
        <div class="sheet-code" id="itemModalCode"></div>
      </header>

      <div class="sheet-titleline">
        <span>ITEM DOSSIER</span>
        <span id="itemModalFamily"></span>
      </div>

      <div class="item-sheet-layout">
        <section class="item-sheet-media">
          <div class="item-sheet-image-frame">
            <img id="itemModalImage" alt="" />
          </div>
          <div class="item-sheet-identity" id="itemModalIdentity"></div>
        </section>

        <section class="item-sheet-content">
          <div class="item-heading-block">
            <span class="modal-category" id="itemModalCategory"></span>
            <h2 id="itemModalName"></h2>
            <p id="itemModalSummary"></p>
          </div>

          <section class="sheet-section">
            <h3>DESCRIÇÃO</h3>
            <p id="itemModalDescription"></p>
          </section>

          <section class="sheet-section" id="itemModalUseSection">
            <h3>USO</h3>
            <p id="itemModalUse"></p>
          </section>

          <section class="sheet-section">
            <h3>ATRIBUTOS</h3>
            <div class="modal-attributes" id="itemModalAttributes"></div>
          </section>

          <section class="sheet-section" id="itemModalTagsSection">
            <h3>TAGS</h3>
            <div class="modal-tags" id="itemModalTags"></div>
          </section>
        </section>
      </div>
    </article>
  </dialog>

  <script src="./site-data.js"></script>
  <script src="./inventario-data.js"></script>
  <script src="./inventario.js"></script>
</body>
</html>
